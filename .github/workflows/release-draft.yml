name: Create Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in the form Major.Minor.Patch (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: x64
            rid: x64
          - platform: ARM64
            rid: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild ProcessDiary/ProcessDiary.csproj /t:Restore /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=win-${{ matrix.rid }} /p:PublishProfile=

      - name: Publish unpackaged app
        run: >
          msbuild ProcessDiary/ProcessDiary.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=win-${{ matrix.rid }}
          /p:WindowsPackageType=None
          /p:EnableMsixTooling=false
          /p:PublishProfile=
          /p:PublishDir="${{ github.workspace }}\artifacts\publish\"

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet build ProcessDiary.Installer/ProcessDiary.Installer.wixproj -c Release -p:Platform=${{ matrix.platform }} -p:Version=${{ inputs.version }}.0 -p:PublishDir="${{ github.workspace }}\artifacts\publish\"
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $msi = Get-ChildItem ProcessDiary.Installer/bin -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'No MSI was produced.' }
          Copy-Item $msi.FullName "out/ProcessDiary-${{ inputs.version }}-${{ matrix.platform }}.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: msi-${{ matrix.platform }}
          path: out/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: msi-*
          path: out
          merge-multiple: true

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}"
          out/*.msi
          --repo "${{ github.repository }}"          --draft
          --generate-notes
          --title "ProcessDiary ${{ inputs.version }}"
          --target "${{ github.sha }}"
