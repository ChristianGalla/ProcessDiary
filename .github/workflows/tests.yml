name: Tests

on:
  push:
    paths:
      - "ProcessDiary/**"
      - "ProcessDiary.Application/**"
      - "ProcessDiary.Domain/**"
      - "ProcessDiary.Infrastructure/**"
      - "ProcessDiary.Tests/**"
      - "ProcessDiary.slnx"
      - "**/Directory.*.props"
      - "**/Directory.*.targets"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "ProcessDiary/**"
      - "ProcessDiary.Application/**"
      - "ProcessDiary.Domain/**"
      - "ProcessDiary.Infrastructure/**"
      - "ProcessDiary.Tests/**"
      - "ProcessDiary.slnx"
      - "**/Directory.*.props"
      - "**/Directory.*.targets"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProcessDiary.Tests/ProcessDiary.Tests.csproj

      - name: Test
        run: dotnet test ProcessDiary.Tests/ProcessDiary.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
