<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ProcessDiary icon">
  <defs>
	<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
	  <stop offset="0" stop-color="#1FB5B0"/>
	  <stop offset="1" stop-color="#1D4E9E"/>
	</linearGradient>
	<linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
	  <stop offset="0" stop-color="#FFFFFF"/>
	  <stop offset="1" stop-color="#E9F1F8"/>
	</linearGradient>
	<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
	  <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2A57" flood-opacity="0.35"/>
	</filter>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <!-- Timeline -->
  <line x1="52" y1="62" x2="52" y2="196" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <circle cx="52" cy="76" r="9" fill="#FFFFFF"/>
  <circle cx="52" cy="128" r="9" fill="#FFB547"/>
  <circle cx="52" cy="180" r="9" fill="#FFFFFF"/>

  <!-- Notebook page with folded corner -->
  <g filter="url(#shadow)">
	<path d="M80 52 H200 a12 12 0 0 1 12 12 V176 L176 212 H92 a12 12 0 0 1 -12 -12 Z" fill="url(#page)"/>
  </g>
  <path d="M176 212 V188 a12 12 0 0 1 12 -12 H212 Z" fill="#C9D9E8"/>

  <!-- Mini app window -->
  <rect x="96" y="70" width="100" height="70" rx="8" fill="#FFFFFF" stroke="#1D4E9E" stroke-width="4"/>
  <path d="M96 78 a8 8 0 0 1 8 -8 H188 a8 8 0 0 1 8 8 V90 H96 Z" fill="#1D4E9E"/>
  <circle cx="108" cy="80" r="3.5" fill="#FFFFFF"/>
  <circle cx="120" cy="80" r="3.5" fill="#FFFFFF"/>
  <circle cx="132" cy="80" r="3.5" fill="#FFB547"/>
  <rect x="106" y="100" width="56" height="7" rx="3.5" fill="#1FB5B0"/>
  <rect x="106" y="114" width="78" height="7" rx="3.5" fill="#B9CDE0"/>
  <rect x="106" y="126" width="40" height="7" rx="3.5" fill="#B9CDE0"/>

  <!-- Diary text lines -->
  <rect x="96" y="156" width="84" height="7" rx="3.5" fill="#B9CDE0"/>
  <rect x="96" y="172" width="58" height="7" rx="3.5" fill="#B9CDE0"/>

  <!-- Amber connector from timeline to page -->
  <line x1="61" y1="128" x2="80" y2="128" stroke="#FFB547" stroke-width="6" stroke-linecap="round"/>
</svg>
